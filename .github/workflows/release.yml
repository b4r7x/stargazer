name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full merged-main commit SHA to publish from (normally the current main tip)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or Publish
    # Only publish from trusted push provenance on this repository's main
    # branch. A `pull_request`-origin CI run (including a fork
    # whose head branch is named `main`) must never reach this privileged,
    # OIDC-bearing job or its `head_sha` checkout.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    # Budget = setup + gate + publish, with headroom for a slow runner:
    #   setup (checkout, pnpm install, Chromium)   ~1 min observed
    #   `release-check`                             24.5-27.6 min observed over
    #                                               four runs (34026760050,
    #                                               34021781478, 33988183640,
    #                                               33996118985)
    #   `pnpm run release`: four `prepack` builds
    #   (~1 min, see below) + four npm uploads
    #   with provenance                             ~3 min
    #   = ~32 min at the slow end; 45 leaves ~13 min for a cold cache or a
    #   slower runner.
    # Of the four builds, only diffgazer's `build:deps` replays from the gate's
    # warm Turbo cache; ui, keys, and add run tsup/tsc directly, and so do
    # diffgazer's own web embed, tsup bundle, and notices. Local dry-runs:
    # keys 6 s, ui 21 s, add 1 s, diffgazer 36 s — about a minute together.
    # The gate is the only verification before publish — no package runs a
    # `prepublishOnly` suite inside `pnpm publish` (PACKAGE_GOVERNANCE.md,
    # Package Build Guards). The old hooks repeated ~8 min of type-check and
    # tests per run, and a 30 min budget once cancelled the first real publish
    # mid-package.
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup repo
        uses: ./.github/actions/setup-repo

      - name: Install Chromium
        run: pnpm --filter @diffgazer/web exec playwright install --with-deps chromium

      - name: Release readiness gate
        run: pnpm run release-check

      # The token goes into an auth header rather than the origin URL, so no git
      # command echoes it and the teardown below has a single key to unset — the
      # shape actions/checkout uses, which `persist-credentials: false` opted out
      # of writing here.
      - name: Configure ephemeral git credentials for changesets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub raises no workflow-triggering event for anything `GITHUB_TOKEN`
      # creates, so the `chore: version packages` PR this opens receives zero
      # CI checks of its own. Its content is verified by the successful
      # push-to-main run after it merges — and if that run is red, by the next
      # green one: the publish set below is derived from npm, not from the
      # commit (PACKAGE_GOVERNANCE.md, Publish Flow). No App or PAT is used for
      # this intentional post-merge verification model.
      - name: Version PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # A bare `pnpm run release` publishes every release-managed package
          # whose manifest version is absent from npm and announces every
          # published version still missing its tag; guard-publish.mjs still
          # refuses a never-published name that is not on its allowlist, and
          # refuses to run at all unless GITHUB_ACTIONS is "true" — this job —
          # or an operator passes --allow-local (PACKAGE_GOVERNANCE.md,
          # Release Process).
          publish: pnpm run release
          version: pnpm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        # No npm token: every `pnpm publish` exchanges this job's OIDC identity
        # (`id-token: write`) for a short-lived token against the trusted
        # publisher configured on npmjs.com for that package (GitHub Actions,
        # b4r7x/diffgazer, workflow release.yml). changesets/action writes no
        # .npmrc without NPM_TOKEN and only logs that OIDC is available.
        # Provenance is not an env switch: pnpm 11 reads no `NPM_CONFIG_*` env, so
        # guard-publish.mjs passes `--provenance` to every `pnpm publish`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hand-written credentials get no post-job unset from actions/checkout, so
      # the header must not outlive the step that needed it.
      - name: Remove ephemeral git credentials
        if: always()
        run: git config --unset-all http.https://github.com/.extraheader || true

  recovery:
    name: Recover Publish from Merged Main SHA
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    # Same setup, gate, and four-build publish as the release job above.
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      pull-requests: write
      id-token: write
      issues: write
    steps:
      # workflow_dispatch executes the workflow definition from the ref the operator
      # selected, so the steps that reach the OIDC identity must come
      # from main. The environment reviewer sees a run name and a branch, never the
      # diff — the same reason deploy.yml guards its privileged manual trigger.
      - name: Require main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "${RELEASE_REF}" != "refs/heads/main" ]; then
            echo "::error::Recovery publishes must run from refs/heads/main."
            exit 1
          fi

      - name: Validate recovery SHA format
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi

      - name: Checkout selected recovery commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify selected commit is merged into main
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          selected_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "$selected_sha" != "${RELEASE_SHA,,}" ]]; then
            echo "Checked-out commit does not match release_sha" >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$selected_sha" refs/remotes/origin/main; then
            echo "release_sha must already be merged into main" >&2
            exit 1
          fi

      # Ancestry proves the commit is on main; it does not prove the commit was
      # verified. The primary job gets that proof from its `workflow_run` trigger
      # (CI, push, main, success). Recovery has no trigger edge, so
      # it asks the API for the same evidence: every required CI job green
      # for this exact SHA. What gets published is decided by npm, not by the
      # SHA, so the SHA only picks the tree the tarballs are packed from —
      # choose the newest green main commit. `release-check` below is defence
      # in depth, not a substitute — it omits the event-range Gitleaks scan and
      # the dirty-tree guard.
      - name: Require CI success for recovery SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail

          run_info="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .status == "completed")] | sort_by(.run_started_at // .created_at) | last | select(. != null) | [.id, .conclusion, .html_url] | @tsv')"
          if [ -z "${run_info}" ]; then
            echo "::error::No completed CI run found on main for ${RELEASE_SHA}."
            exit 1
          fi

          IFS=$'\t' read -r run_id run_conclusion run_url <<< "${run_info}"
          if [ "${run_conclusion}" != "success" ]; then
            echo "::error::CI for ${RELEASE_SHA} concluded '${run_conclusion}', not success: ${run_url}"
            exit 1
          fi

          jobs="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq '.jobs[] | [.name, .conclusion] | @tsv')"
          expected_jobs=(
            "Gitleaks Event-Range Scan"
            "Build, Type-Check, and Test"
          )
          for expected_job in "${expected_jobs[@]}"; do
            conclusion="$(awk -F '\t' -v job="${expected_job}" '$1 == job { print $2 }' <<< "${jobs}" | tail -n 1)"
            if [ -z "${conclusion}" ]; then
              echo "::error::CI job '${expected_job}' is missing for ${RELEASE_SHA}: ${run_url}"
              exit 1
            fi
            if [ "${conclusion}" != "success" ]; then
              echo "::error::CI job '${expected_job}' concluded '${conclusion}', not success: ${run_url}"
              exit 1
            fi
          done
          echo "CI run ${run_id} is green for ${RELEASE_SHA}."

      - name: Setup repo
        uses: ./.github/actions/setup-repo

      - name: Install Chromium
        run: pnpm --filter @diffgazer/web exec playwright install --with-deps chromium

      - name: Release readiness gate
        run: pnpm run release-check

      # The token goes into an auth header rather than the origin URL, so no git
      # command echoes it and the teardown below has a single key to unset — the
      # shape actions/checkout uses, which `persist-credentials: false` opted out
      # of writing here.
      - name: Configure ephemeral git credentials for changesets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recover version metadata or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # Same npm-derived publish as the primary job above, `--provenance`
          # included.
          publish: pnpm run release
          version: pnpm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same teardown as the primary job: nothing else unsets a hand-written header.
      - name: Remove ephemeral git credentials
        if: always()
        run: git config --unset-all http.https://github.com/.extraheader || true
