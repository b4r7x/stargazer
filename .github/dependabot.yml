version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows plus a root action.yml only. Composite actions
    # in nested directories need their own entry or their pins are never updated.
    directories:
      - "/"
      - "/.github/actions/setup-repo"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
    # changesets/action v2 needs Changesets CLI v3, kebab-case inputs,
    # push-with-git-cli, and a CHANGESETS_OUTPUT tag protocol from
    # guard-publish.mjs; it migrates in a dedicated PR, not the weekly group.
    ignore:
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      docker-updates:
        patterns:
          - "*"
    # node:24 is the Active LTS line these images ship. Node 26 is Current,
    # not LTS, until October 2026; revisit this ignore when it enters LTS and
    # migrate in a dedicated PR, not the weekly group.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/cli/*"
      - "/libs/*"
      - "/libs/keys/artifacts"
      - "/libs/keys/examples/playground"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Workspace packages version independently; bump declared ranges in the
    # manifest that owns the dependency rather than widening a shared range.
    versioning-strategy: increase
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Majors are grouped (not ungrouped per-dependency) so the public-API
      # blast radius of each major is reviewed in one PR per cadence.
      major:
        update-types:
          - "major"
